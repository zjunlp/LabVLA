# Name components using the following fields.
vla_model_type: "xvla"                    # VLA model type.
task_name: "level3_open_mergedata"                     # Task name.
train_steps: 20000                           # Training step count.
name: ${vla_model_type}_${task_name}_${train_steps}_${max_episodes}  # Compose the run name.

task_type: "openclose"
controller_type: "open"

mode: "infer"
usd_path: "assets/chemistry_lab/lab_001/lab_001.usd"

max_episodes: 120

infer:
  type: "remote" # "local", "remote", "replay"
  replay_data_path: "/home/ubuntu/Documents/LabUtopia/outputs/collect/2026.02.08/22.08.04_Level3_open/dataset/episode_0001.h5"
  episode_index: 0 # replay mode only
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb', "camera_3_rgb": 'camera_3_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "223.109.239.32"  # js3.blockelite.cn  117.148.167.87 223.109.239.32
  port: 22317
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

  is_test_material: False                  # True by default; main.py runs True and False sequentially.

task:
  max_steps: 1000
  operate_type: "door" # "door" or "drawer"
  obj_paths:
    - path: "/World/DryingBox_01"
      position_range:
        x: [0.72, 0.77]
        y: [0.0, 0.15]
        z: [0.78, 0.78]
      close_gripper_distance: 0.015
    - path: "/World/DryingBox_02"
      position_range:
        x: [0.72, 0.77]
        y: [-0.05, 0.010]
        z: [0.78, 0.78]
      close_gripper_distance: 0.02
    - path: "/World/MuffleFurnace"
      position_range:
        x: [0.65, 0.70]
        y: [-0.05, 0.010]
        z: [0.78, 0.78]
      close_gripper_distance: 0.02
  material_paths:
    - path: "/World/table/surface"
      materials:
        - "/World/Looks/Material1_plastic_dark_blue"
        - "/World/Looks/Material2_wood"
        - "/World/Looks/Material3_plastic_dark_green"
        - "/World/Looks/Material4_plastic_light_white"
        - "/World/Looks/Material5_black"
      test_materials:
        - "/World/Looks/Material6_plastic_light_blue"
        - "/World/Looks/Material7_stainless"

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [-0.7, 1.4, 1.4]
    resolution: [256, 256]
    focal_length: 2
    orientation: [-0.2297, -0.18336, 0.59631, 0.74701]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "camera_2"
    translation: [-1, -0.1, 3.6]
    resolution: [256, 256]
    focal_length: 4
    orientation: [0.69035, 0.15304, -0.15304, -0.69035]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    resolution: [256, 256]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.4, -0, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}