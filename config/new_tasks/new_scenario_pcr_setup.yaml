# ============================================================================
# Additional scenario 2: PCR preparation.
# Prepare PCR tubes, add primers and template, and load the PCR machine.
# Assets: PCR_Machine, PCR_Tube, Micropipette, and TipBox (previously unused assets).
# Scene: lab_072 (previously unused scene).
# ============================================================================

name: NewScenario_PCRSetup

task_type: "pcr_setup"
controller_type: "pcr_setup"

mode: "collect"

usd_path: "assets/new_tasks/lab_pcr/lab_pcr.usd"

pcr_machine_path: "/World/PCR_Machine"
pcr_machine_lid_path: "/World/PCR_Machine/Lid"
pcr_tube_rack_path: "/World/PCR_TubeRack"
micropipette_path: "/World/Micropipette"
tip_box_path: "/World/TipBox"
primer_tubes:
  - path: "/World/Primer_Forward"
  - path: "/World/Primer_Reverse"
template_tube_path: "/World/TemplateTube"
master_mix_path: "/World/MasterMix"

pcr_tubes:
  - path: "/World/PCR_Tube_1"
  - path: "/World/PCR_Tube_2"
  - path: "/World/PCR_Tube_3"
  - path: "/World/PCR_Tube_4"

max_episodes: 100

infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

task:
  max_steps: 2500
  obj_paths:
    - path: "/World/Micropipette"
      position_range:
        x: [0.1, 0.2]
        y: [-0.15, -0.1]
        z: [0.85, 0.85]
    - path: "/World/PCR_Tube_1"
      position_range:
        x: [0.25, 0.3]
        y: [-0.05, 0.05]
        z: [0.85, 0.85]

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [2.5, 0, 2.5]
    resolution: [256, 256]
    focal_length: 6
    orientation: [0.61237, 0.35355, 0.35355, 0.61237]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "camera_2"
    translation: [0.1, 0, 3.0]
    resolution: [256, 256]
    focal_length: 6
    orientation: [0.70711, 0, 0, -0.70711]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    resolution: [256, 256]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.5, 0, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
