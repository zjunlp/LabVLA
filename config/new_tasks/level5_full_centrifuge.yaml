# ============================================================================
# Level 5 complex-sequence task: full centrifuge workflow.
# Prepare multiple sample tubes, load and balance the centrifuge, close and start it, wait, and unload samples.
# Assets: Centrifuge, TestTube, TubeRack, and Timer (previously unused assets).
# Scene: lab_061 (previously unused scene).
# ============================================================================

name: NewLevel5_FullCentrifugeProcess

task_type: "full_centrifuge"
controller_type: "full_centrifuge"

mode: "collect"

usd_path: "assets/new_tasks/lab_centrifuge_full/lab_centrifuge_full.usd"

centrifuge_path: "/World/Centrifuge"
centrifuge_lid_path: "/World/Centrifuge/Lid"
centrifuge_rotor_path: "/World/Centrifuge/Rotor"
tube_rack_path: "/World/TubeRack"
timer_path: "/World/Timer"

sample_tubes:
  - path: "/World/SampleTube_1"
  - path: "/World/SampleTube_2"
  - path: "/World/SampleTube_3"
  - path: "/World/SampleTube_4"

max_episodes: 100

infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

task:
  max_steps: 3000
  obj_paths:
    - path: "/World/SampleTube_1"
      position_range:
        x: [0.1, 0.15]
        y: [-0.05, 0.05]
        z: [0.85, 0.85]
    - path: "/World/SampleTube_2"
      position_range:
        x: [0.1, 0.15]
        y: [0.05, 0.15]
        z: [0.85, 0.85]
    - path: "/World/SampleTube_3"
      position_range:
        x: [0.2, 0.25]
        y: [-0.05, 0.05]
        z: [0.85, 0.85]
    - path: "/World/SampleTube_4"
      position_range:
        x: [0.2, 0.25]
        y: [0.05, 0.15]
        z: [0.85, 0.85]

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [2.5, 0, 2.5]
    resolution: [256, 256]
    focal_length: 6
    orientation: [0.61237, 0.35355, 0.35355, 0.61237]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "camera_2"
    translation: [0.1, 0, 3.0]
    resolution: [256, 256]
    focal_length: 6
    orientation: [0.70711, 0, 0, -0.70711]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    resolution: [256, 256]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.5, 0, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
