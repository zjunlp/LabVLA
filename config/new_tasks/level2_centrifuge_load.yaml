# ============================================================================
# Level 2 combined task: load a centrifuge.
# Pick up a test tube and place it in the centrifuge.
# Assets: Centrifuge and TestTube (previously unused assets).
# Scene: lab_052 (previously unused scene).
# ============================================================================

name: NewLevel2_CentrifugeLoad

task_type: "centrifuge_load"
controller_type: "centrifuge_load"

mode: "collect"

usd_path: "assets/new_tasks/lab_centrifuge/lab_centrifuge.usd"

centrifuge_path: "/World/Centrifuge"
testtube_path: "/World/TestTube"
target_slot_path: "/World/Centrifuge/Slot_01"

max_episodes: 100

infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

task:
  max_steps: 1200
  obj_paths:
    - path: "/World/TestTube"
      position_range:
        x: [0.20, 0.30]
        y: [-0.08, 0.08]
        z: [0.85, 0.85]

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [2, 0, 2]
    resolution: [256, 256]
    focal_length: 6
    orientation: [0.61237, 0.35355, 0.35355, 0.61237]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "camera_2"
    translation: [0.1, 0, 2.5]
    resolution: [256, 256]
    focal_length: 6
    orientation: [0.70711, 0, 0, -0.70711]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    resolution: [256, 256]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.4, 0, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
