# ============================================================================
# Additional scenario 1: spectrophotometer operation.
# Prepare a cuvette, load the sample, place it in the spectrophotometer, and read the result.
# Assets: Spectrophotometer, Cuvette, and Pipette (previously unused assets).
# Scene: lab_070 (previously unused scene).
# ============================================================================

name: NewScenario_Spectrophotometer

task_type: "spectrophotometer"
controller_type: "spectrophotometer"

mode: "collect"

usd_path: "assets/new_tasks/lab_spectrophotometer/lab_spectrophotometer.usd"

spectrophotometer_path: "/World/Spectrophotometer"
sample_chamber_path: "/World/Spectrophotometer/SampleChamber"
cuvette_path: "/World/Cuvette"
pipette_path: "/World/Pipette"
sample_solution_path: "/World/SampleSolution"
blank_solution_path: "/World/BlankSolution"

max_episodes: 100

infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

task:
  max_steps: 1800
  obj_paths:
    - path: "/World/Cuvette"
      position_range:
        x: [0.15, 0.25]
        y: [-0.1, 0.1]
        z: [0.85, 0.85]
    - path: "/World/Pipette"
      position_range:
        x: [0.35, 0.45]
        y: [-0.1, 0.1]
        z: [0.85, 0.85]

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [2.5, 0, 2.5]
    resolution: [256, 256]
    focal_length: 6
    orientation: [0.61237, 0.35355, 0.35355, 0.61237]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "camera_2"
    translation: [0.1, 0, 3.0]
    resolution: [256, 256]
    focal_length: 6
    orientation: [0.70711, 0, 0, -0.70711]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    resolution: [256, 256]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.5, 0, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
