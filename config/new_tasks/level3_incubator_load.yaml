# ============================================================================
# Level 3 task: load an incubator.
# Open the incubator door, place a Petri dish, and close the door.
# Assets: Incubator and Petri_Dish (previously unused assets).
# Scene: lab_054 (previously unused scene).
# ============================================================================

name: NewLevel3_IncubatorLoad

task_type: "incubator_load"
controller_type: "incubator_load"

mode: "collect"

usd_path: "assets/new_tasks/lab_incubator/lab_incubator.usd"

incubator_path: "/World/Incubator"
incubator_door_path: "/World/Incubator/Door"
petri_dish_path: "/World/PetriDish"
target_shelf_path: "/World/Incubator/Shelf_01"

max_episodes: 100

infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

task:
  max_steps: 1500
  obj_paths:
    - path: "/World/PetriDish"
      position_range:
        x: [0.20, 0.30]
        y: [-0.08, 0.08]
        z: [0.85, 0.85]

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [2, 0, 2]
    resolution: [256, 256]
    focal_length: 6
    orientation: [0.61237, 0.35355, 0.35355, 0.61237]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "camera_2"
    translation: [0.1, 0, 2.5]
    resolution: [256, 256]
    focal_length: 6
    orientation: [0.70711, 0, 0, -0.70711]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    resolution: [256, 256]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.4, 0, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
