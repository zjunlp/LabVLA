# ============================================================================
# Additional scenario 3: gel electrophoresis.
# Prepare the gel, load samples, connect power, and run electrophoresis.
# Assets: ElectrophoresisApparatus, GelTray, Micropipette, and Ladder (previously unused assets).
# Scene: lab_075 (previously unused scene).
# ============================================================================

name: NewScenario_GelElectrophoresis

task_type: "gel_electrophoresis"
controller_type: "gel_electrophoresis"

mode: "collect"

usd_path: "assets/new_tasks/lab_electrophoresis/lab_electrophoresis.usd"

electrophoresis_path: "/World/ElectrophoresisApparatus"
electrophoresis_lid_path: "/World/ElectrophoresisApparatus/Lid"
gel_tray_path: "/World/GelTray"
micropipette_path: "/World/Micropipette"
ladder_tube_path: "/World/LadderTube"
power_supply_path: "/World/PowerSupply"

sample_tubes:
  - path: "/World/SampleTube_1"
  - path: "/World/SampleTube_2"
  - path: "/World/SampleTube_3"

max_episodes: 100

infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

task:
  max_steps: 2200
  obj_paths:
    - path: "/World/Micropipette"
      position_range:
        x: [0.1, 0.2]
        y: [-0.15, -0.1]
        z: [0.85, 0.85]
    - path: "/World/SampleTube_1"
      position_range:
        x: [0.25, 0.3]
        y: [-0.1, 0.0]
        z: [0.85, 0.85]
    - path: "/World/SampleTube_2"
      position_range:
        x: [0.25, 0.3]
        y: [0.0, 0.1]
        z: [0.85, 0.85]

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [2.5, 0, 2.5]
    resolution: [256, 256]
    focal_length: 6
    orientation: [0.61237, 0.35355, 0.35355, 0.61237]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "camera_2"
    translation: [0.1, 0, 3.0]
    resolution: [256, 256]
    focal_length: 6
    orientation: [0.70711, 0, 0, -0.70711]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    resolution: [256, 256]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.5, 0, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
