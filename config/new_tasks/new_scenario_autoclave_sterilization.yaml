# ============================================================================
# Additional scenario 5: autoclave sterilization.
# Prepare items, load the autoclave, set parameters, sterilize, and unload.
# Assets: Autoclave, ErlenmeyerFlask, Beaker, and SterilizationTray (previously unused assets).
# Scene: lab_080 (previously unused scene).
# ============================================================================

name: NewScenario_AutoclaveSterilization

task_type: "autoclave_sterilization"
controller_type: "autoclave_sterilization"

mode: "collect"

usd_path: "assets/new_tasks/lab_autoclave/lab_autoclave.usd"

autoclave_path: "/World/Autoclave"
autoclave_door_path: "/World/Autoclave/Door"
autoclave_chamber_path: "/World/Autoclave/Chamber"
sterilization_tray_path: "/World/SterilizationTray"

items_to_sterilize:
  - path: "/World/Flask_1"
  - path: "/World/Flask_2"
  - path: "/World/Beaker_1"
  - path: "/World/Beaker_2"

indicator_tape_path: "/World/IndicatorTape"
safety_gloves_path: "/World/SafetyGloves"

max_episodes: 100

infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

task:
  max_steps: 2800
  obj_paths:
    - path: "/World/Flask_1"
      position_range:
        x: [0.1, 0.2]
        y: [-0.15, -0.1]
        z: [0.85, 0.85]
    - path: "/World/Flask_2"
      position_range:
        x: [0.1, 0.2]
        y: [0.1, 0.15]
        z: [0.85, 0.85]
    - path: "/World/Beaker_1"
      position_range:
        x: [0.25, 0.35]
        y: [-0.1, 0.0]
        z: [0.85, 0.85]
    - path: "/World/Beaker_2"
      position_range:
        x: [0.25, 0.35]
        y: [0.0, 0.1]
        z: [0.85, 0.85]
    - path: "/World/SterilizationTray"
      position_range:
        x: [0.45, 0.55]
        y: [-0.1, 0.1]
        z: [0.85, 0.85]

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [2.5, 0, 2.5]
    resolution: [256, 256]
    focal_length: 6
    orientation: [0.61237, 0.35355, 0.35355, 0.61237]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "camera_2"
    translation: [0.1, 0, 3.0]
    resolution: [256, 256]
    focal_length: 6
    orientation: [0.70711, 0, 0, -0.70711]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    resolution: [256, 256]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.5, 0, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
