# ============================================================================
# Level 4 long-sequence task: prepare a microscope sample.
# Prepare a slide, add a sample, apply a coverslip, and place it in the microscope.
# Assets: Microscope, Dropper, and GlassSlide (previously unused assets).
# Scene: lab_058 (previously unused scene).
# ============================================================================

name: NewLevel4_MicroscopeSample

task_type: "microscope_sample"
controller_type: "microscope_sample"

mode: "collect"

usd_path: "assets/new_tasks/lab_microscope/lab_microscope.usd"

microscope_path: "/World/Microscope"
microscope_stage_path: "/World/Microscope/Stage"
dropper_path: "/World/Dropper"
slide_path: "/World/GlassSlide"
coverslip_path: "/World/CoverSlip"

max_episodes: 100

infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

task:
  max_steps: 2500
  obj_paths:
    - path: "/World/GlassSlide"
      position_range:
        x: [0.1, 0.2]
        y: [-0.1, 0.1]
        z: [0.85, 0.85]
    - path: "/World/Dropper"
      position_range:
        x: [0.25, 0.35]
        y: [-0.1, 0.1]
        z: [0.85, 0.85]
    - path: "/World/CoverSlip"
      position_range:
        x: [0.4, 0.5]
        y: [-0.1, 0.1]
        z: [0.85, 0.85]

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [2.5, 0, 2.5]
    resolution: [256, 256]
    focal_length: 6
    orientation: [0.61237, 0.35355, 0.35355, 0.61237]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "camera_2"
    translation: [0.1, 0, 3.0]
    resolution: [256, 256]
    focal_length: 6
    orientation: [0.70711, 0, 0, -0.70711]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    resolution: [256, 256]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.5, 0, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
