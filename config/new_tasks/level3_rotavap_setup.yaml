# ============================================================================
# Level 3 task: set up a rotary evaporator.
# Mount a round-bottom flask on the rotary evaporator.
# Assets: Rotavapor and Round_bottomFlask (previously unused assets).
# Scene: lab_055 (previously unused scene).
# ============================================================================

name: NewLevel3_RotavapSetup

task_type: "rotavap_setup"
controller_type: "rotavap_setup"

mode: "collect"

usd_path: "assets/new_tasks/lab_rotavap/lab_rotavap.usd"

rotavap_path: "/World/Rotavapor"
flask_path: "/World/RoundBottomFlask"
mount_point_path: "/World/Rotavapor/MountPoint"

max_episodes: 100

infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

task:
  max_steps: 1500
  obj_paths:
    - path: "/World/RoundBottomFlask"
      position_range:
        x: [0.18, 0.28]
        y: [-0.10, 0.10]
        z: [0.85, 0.85]

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [2, 0, 2]
    resolution: [256, 256]
    focal_length: 6
    orientation: [0.61237, 0.35355, 0.35355, 0.61237]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "camera_2"
    translation: [0.1, 0, 2.5]
    resolution: [256, 256]
    focal_length: 6
    orientation: [0.70711, 0, 0, -0.70711]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    resolution: [256, 256]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.4, 0, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
