# ============================================================================
# Level 4 long-sequence task: operate a fume hood.
# Open the fume hood, place and operate on a flask, then retrieve it.
# Assets: FumeHood and ErlenmeyerFlask (previously unused assets).
# Scene: lab_056 (previously unused scene).
# ============================================================================

name: NewLevel4_FumeHoodOperation

task_type: "fumehood_operation"
controller_type: "fumehood_operation"

mode: "collect"

usd_path: "assets/new_tasks/lab_fumehood/lab_fumehood.usd"

fumehood_path: "/World/FumeHood"
fumehood_sash_path: "/World/FumeHood/Sash"
flask_path: "/World/ErlenmeyerFlask"
work_surface_path: "/World/FumeHood/WorkSurface"

max_episodes: 100

infer:
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

task:
  max_steps: 2000
  obj_paths:
    - path: "/World/ErlenmeyerFlask"
      position_range:
        x: [0.15, 0.25]
        y: [-0.12, 0.12]
        z: [0.85, 0.85]

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [2.5, 0, 2.5]
    resolution: [256, 256]
    focal_length: 6
    orientation: [0.61237, 0.35355, 0.35355, 0.61237]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "camera_2"
    translation: [0.1, 0, 3.0]
    resolution: [256, 256]
    focal_length: 6
    orientation: [0.70711, 0, 0, -0.70711]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    resolution: [256, 256]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.5, 0, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
